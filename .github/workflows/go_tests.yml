name: Go tests
on:
  push:
  pull_request:
  schedule: # daily at 10:22 UTC
    - cron: "22 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - { go-version: stable }
          - { go-version-file: go.mod }
        deps:
          - locked
          - latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: echo "${{ matrix.deps }}-${{ matrix.go.go-version }}-${{ matrix.go.go-version-file }}" > env.txt
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go.go-version }}
          go-version-file: ${{ matrix.go.go-version-file }}
          cache-dependency-path: |
              go.mod
              env.txt
      # Download/upgrade deps over the native runner network. Doing this outside the
      # sandbox avoids intermittent "zip: checksum error" failures caused by module
      # downloads being truncated by the sandbox's network stack.
      - name: Upgrade deps
        if: matrix.deps == 'latest'
        run: |
          go get -u -t ./...
          go mod download
      - name: Download deps
        if: matrix.deps != 'latest'
        run: go mod download
      - uses: geomys/sandboxed-step@v1.2.1
        if: matrix.deps == 'latest'
        continue-on-error: true
        with:
          run: go test -v ./...
      - uses: geomys/sandboxed-step@v1.2.1
        if: matrix.deps != 'latest'
        continue-on-error: false
        with:
          run: go test -v ./...
